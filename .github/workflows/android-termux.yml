name: Build Android Termux binary

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
          cache: true

      - name: Build ARM64 Android binary
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -o dist/spicetify-mobile-android-arm64 .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spicetify-mobile-android-arm64
          path: dist/spicetify-mobile-android-arm64
          if-no-files-found: error

      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spicetify-mobile-android-arm64
